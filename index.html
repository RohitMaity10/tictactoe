<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Tic-Tac-Toe</h1>
    
    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-card player-x active" id="card-x">
        <span class="player-label">Player X</span>
        <span class="score" id="score-x">0</span>
      </div>
      <div class="score-card ties" id="card-ties">
        <span class="player-label">Ties</span>
        <span class="score" id="score-ties">0</span>
      </div>
      <div class="score-card player-o" id="card-o">
        <span class="player-label">Player O</span>
        <span class="score" id="score-o">0</span>
      </div>
    </div>

    <!-- Turn / Status Indicator -->
    <div class="status" id="status">Turn: <span class="highlight">Player X</span></div>

    <!-- 3x3 Game Board -->
    <div class="board" id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn" id="restart-btn">Restart Game</button>
      <button class="btn secondary" id="reset-score-btn">Reset Score</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
